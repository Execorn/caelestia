# ### Hyprland ###
# Apps
$terminal = alacritty
$browser = zen-browser
$editor = code
$fileExplorer = thunar

# Touchpad
$touchpadDisableTyping = true
$touchpadScrollFactor = 0.3
$workspaceSwipeFingers = 4
$gestureFingers = 3
$gestureFingersMore = 4

# Blur
$blurEnabled = true
$blurSpecialWs = false
$blurPopups = true
$blurInputMethods = true
$blurSize = 8
$blurPasses = 2
$blurXray = false

# Shadow
$shadowEnabled = true
$shadowRange = 15
$shadowRenderPower = 4
$shadowColour = rgba($inversePrimary10)

# Gaps
$workspaceGaps = 20
$windowGapsIn = 5
$windowGapsOut = 10
$singleWindowGapsOut = 20

# Window styling
$windowOpacity = 0.95
$windowRounding = 15

$windowBorderSize = 1
$activeWindowBorderColour = rgba($primarye6)
$inactiveWindowBorderColour = rgba($onSurfaceVariant11)

# Misc
$volumeStep = 10  # In percent
$cursorTheme = sweet-cursors
$cursorSize = 24


# ### Keybinds ###
# Workspaces
$kbMoveWinToWs = Super+Shift
$kbMoveWinToWsGroup = Ctrl+Super+Alt
$kbGoToWs = Super
$kbGoToWsGroup = Ctrl+Super

$kbNextWs = Super, right
$kbPrevWs = Super, left

$kbToggleSpecialWs = Super+Alt, S

# Window groups
$kbWindowGroupCycleNext = Alt, Tab
$kbWindowGroupCyclePrev = Shift+Alt, Tab
$kbUngroup = Super, U
$kbToggleGroup = Super, Comma

# Window actions
$kbMoveWindow = Super, Z
$kbResizeWindow = Super, X
$kbWindowPip = Super+Alt, Backslash
$kbPinWindow = Super, P
$kbWindowFullscreen = Super, F
$kbWindowBorderedFullscreen = Super+Alt, F
$kbToggleWindowFloating = Super, G
$kbCloseWindow = Super, Q

# Special workspace toggles
$kbSystemMonitor = Ctrl+Shift, Escape
$kbMusic = Super+Alt, M
$kbCommunication = Super+Alt, D
$kbTodo = Super+Alt, R

# Apps
$kbTerminal = Super, Return
$kbBrowser = Super, W
$kbEditor = Super, C
$kbAntigravity = Super, A
$kbFileExplorer = Super, E

# Misc
$kbSession = Super+Shift, E
$kbShowSidebar = Super+Shift, N
$kbClearNotifs = Ctrl+Alt, C
$kbShowPanels = Super+Alt, K
$kbLock = Super+Shift, O
$kbRestoreLock = Super+Alt, O
